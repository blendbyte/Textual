name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.runner }}, ${{ matrix.configuration }}${{ matrix.license-manager && format(', license manager {0}', matrix.license-manager == '1' && 'on' || 'off') || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    # xcode-27: macOS 27 with Xcode 27, the primary development toolchain
    # (GitHub preview image). macos-26: Xcode 26.x, to keep the previous
    # toolchain building for contributors who have not upgraded yet.
    # The App Store configuration has its own feature flags (no licence
    # manager, no Sparkle), so it does not take the licence manager override.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            scheme: Textual (Release)
            configuration: Release
            license-manager: '1'
          - runner: xcode-27
            scheme: Textual (Release)
            configuration: Release
            license-manager: '0'
          - runner: macos-26
            scheme: Textual (Release)
            configuration: Release
            license-manager: '1'
          - runner: xcode-27
            scheme: Textual (Debug)
            configuration: Debug
            license-manager: '1'
          - runner: xcode-27
            scheme: Textual (App Store)
            configuration: App Store

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      # CI builds are unsigned: the real signing identity is configured in
      # Configurations/Signing.xcconfig and is not available on runners.
      # Build settings passed here are inherited by the nested xcodebuild
      # call in Scripts/BuildExtensions.sh.
      - name: Build
        run: |
          xcodebuild \
            -workspace Textual.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/build.xcresult" \
            -quiet \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ${{ matrix.license-manager && format('TEXTUAL_BUILT_WITH_LICENSE_MANAGER={0}', matrix.license-manager) || '' }} \
            build

      - name: Check the warning count
        if: matrix.runner == 'xcode-27' && matrix.configuration == 'Release' && matrix.license-manager == '1'
        run: .github/scripts/warning-ratchet.py .github/baselines/compiler-warnings "Compiler warnings" warnings "$RUNNER_TEMP/build.xcresult"

      - name: Verify build products
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          LICENSE_MANAGER: ${{ matrix.license-manager || '0' }}
        run: |
          contents="$RUNNER_TEMP/DerivedData/Build/Products/$CONFIGURATION/Textual.app/Contents"
          fail() { echo "::error::$1"; exit 1; }

          test -x "$contents/MacOS/Textual" || fail "Textual binary missing"
          archs=$(lipo -archs "$contents/MacOS/Textual")
          [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]] || fail "Textual is not universal: $archs"

          for plugin in "Chat Filters" "Smiley Converter" "System Info" "User Insights" "ZNC Additions"; do
            bundle="$contents/Resources/Bundled Extensions/$plugin.bundle"
            test -d "$bundle" || fail "Plugin missing: $plugin"
            binary="$bundle/Contents/MacOS/$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$bundle/Contents/Info.plist")"
            plugin_archs=$(lipo -archs "$binary") || fail "Plugin binary missing: $plugin"
            [[ "$plugin_archs" == "$archs" ]] || fail "$plugin is built for $plugin_archs, Textual for $archs"
            /usr/libexec/PlistBuddy -c "Print NSPrincipalClass" "$bundle/Contents/Info.plist" > /dev/null || fail "$plugin has no principal class"
          done
          test ! -e "$contents/XPCServices" || fail "Unexpected XPC services: $(ls "$contents/XPCServices")"
          info=$(/usr/libexec/PlistBuddy -c Print "$contents/Info.plist")
          [[ "$info" != *'$('* && "$info" != *'${'* && "$info" != *"#if"* ]] || fail "Info.plist has unexpanded settings or preprocessor lines"
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$contents/Info.plist")
          [[ "$version" =~ ^[0-9]+$ ]] || fail "CFBundleVersion is not a build number: $version"
          test -f "$contents/Resources/Inline Media/ICMInlineImage.mustache" || fail "Inline media resources missing"
          for framework in AutoHyperlinks CocoaExtensions GRMustache; do
            test -d "$contents/Frameworks/$framework.framework" || fail "Framework missing: $framework"
          done
          if [ "$CONFIGURATION" != "App Store" ]; then
            test -d "$contents/Frameworks/Sparkle.framework" || fail "Sparkle missing"
          fi

          grep -q "^#define TEXTUAL_BUILT_WITH_LICENSE_MANAGER $LICENSE_MANAGER\$" "$contents/Headers/FeatureFlags.h" ||
            fail "FeatureFlags.h does not say TEXTUAL_BUILT_WITH_LICENSE_MANAGER $LICENSE_MANAGER"
          if [ "$LICENSE_MANAGER" = "0" ] && nm "$contents/MacOS/Textual" | grep -q -E 'TDCLicenseManagerDialog|TLOLicenseManager'; then
            fail "Licence manager code is compiled in although the licence manager is off"
          fi

      # TextualTests (hosted by the Debug app, which skips its normal startup
      # under XCTest) and the Cocoa Extensions tests.
      - name: Run unit tests
        if: matrix.configuration == 'Debug'
        run: |
          xcodebuild test \
            -workspace Textual.xcworkspace \
            -scheme "Textual (Debug)" \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # The samples build against the app like a third-party plugin does:
      # its public headers, its frameworks and its binary as bundle loader.
      - name: Build the sample plugins
        if: matrix.runner == 'xcode-27' && matrix.configuration == 'Release' && matrix.license-manager == '1'
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Textual.app"
          for project in "Samples/Swift Bot/SwiftPluginExample.xcodeproj" \
                         "Samples/Preference Pane/PreferencePaneExample.xcodeproj"; do
            xcodebuild \
              -project "$project" \
              -configuration Release \
              -quiet \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              BUNDLE_LOADER="$app/Contents/MacOS/Textual" \
              FRAMEWORK_SEARCH_PATHS="\"$app/Contents/Frameworks\"" \
              HEADER_SEARCH_PATHS="\"$app/Contents/Headers\"" \
              SYMROOT="$RUNNER_TEMP/Samples" \
              OBJROOT="$RUNNER_TEMP/Samples/Intermediates" \
              build
          done
          ls "$RUNNER_TEMP/Samples/Release"

      - name: Verify the App Store build has no Sparkle
        if: matrix.configuration == 'App Store'
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/App Store/Textual.app"
          if test -e "$app/Contents/Frameworks/Sparkle.framework"; then
            echo "::error::Sparkle.framework is embedded"; exit 1
          fi
          if otool -L "$app/Contents/MacOS/Textual" | grep -q Sparkle; then
            echo "::error::The app links against Sparkle"; exit 1
          fi
          if /usr/libexec/PlistBuddy -c Print "$app/Contents/Info.plist" | grep -q '^    SU'; then
            echo "::error::Info.plist contains Sparkle keys"; exit 1
          fi

  analyze:
    name: Static analyzer
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyze
        run: |
          xcodebuild analyze \
            -workspace Textual.xcworkspace \
            -scheme "Textual (Release)" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/analyze.xcresult" \
            -quiet \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # The app's build scripts build the plugins with a nested xcodebuild
      # call, which the analysis above builds but doesn't analyze.
      - name: Analyze plugins
        run: .github/scripts/analyze-nested.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/Textual.app" "$RUNNER_TEMP/nested-analysis"

      # Only the analyzer's own findings; compiler warnings are counted by
      # the build job.
      - name: Check the analyzer findings
        run: .github/scripts/warning-ratchet.py .github/baselines/analyzer-findings "Analyzer findings" analyzerWarnings "$RUNNER_TEMP/analyze.xcresult" "$RUNNER_TEMP"/nested-analysis/*.xcresult
