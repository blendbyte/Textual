name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["General Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/blendbyte/Textual/issues) first to avoid duplicates.

        **Security issues:** do not report them here. Follow the [security policy](https://github.com/blendbyte/Textual/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: build
    attributes:
      label: Which build are you using?
      options:
        - Textual 7 (from textualapp.com)
        - Textual 7 from the Mac App Store
        - Textual 8 development build
        - Textual 8 (from textualapp.com)
        - Textual 8 from the Mac App Store
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Textual version
      description: Found under Textual → About Textual. For builds from source, include the commit.
      placeholder: "e.g. 7.2.7, or main @ 4fcfa2c"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 26.1 (Apple silicon)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Textual is affected?
      options:
        - Connecting to servers (TLS, proxies, reconnecting)
        - Authentication (SASL, NickServ, certificates)
        - IRC protocol behavior (channels, modes, IRCv3)
        - Bouncers (ZNC and others)
        - Message view, styles, and themes
        - Inline media and link previews
        - Notifications and highlights
        - Preferences and settings import
        - File transfers (DCC)
        - Plugins, scripts, and extensions
        - Crash or hang
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to ...
        2. Join channel / open preferences ...
        3. See ...
    validations:
      required: true

  - type: input
    id: network
    attributes:
      label: Network or server software (if relevant)
      description: For example Libera.Chat, OFTC, a ZNC bouncer, or the IRCd you are connecting to.
      placeholder: "e.g. Libera.Chat via ZNC 1.9"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, crash reports, or screenshots
      description: |
        For crashes, attach the crash report from Console.app (Crash Reports → Textual).
        Please remove passwords, server credentials, and private conversations before posting.
      render: text
